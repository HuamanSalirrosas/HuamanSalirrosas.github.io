<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libros</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-libros">
  <main class="biblioteca">
    <h1>Libros</h1>

    <div class="lista-libros">
      <figure class="libro">
        <img
          src="https://res.cloudinary.com/uql3pxps/image/upload/v1784764004/surely_your_joking_mr_feynman_sapdfc.jpg"
          alt="Portada de Surely You're Joking, Mr. Feynman!"
          decoding="async"
        >
        <figcaption>
          <h2>Surely You're Joking, Mr. Feynman!</h2>
          <p class="autor">Richard P. Feynman</p>
          <p>Anécdotas llenas de curiosidad, humor y una forma irreverente de mirar la ciencia y la vida.</p>
        </figcaption>
      </figure>

      <figure class="libro">
        <img
          src="https://res.cloudinary.com/uql3pxps/image/upload/v1786701653/breves_respuestas_p3zlsg.jpg"
          alt="Portada de Breves respuestas a las grandes preguntas"
          loading="lazy"
          decoding="async"
        >
        <figcaption>
          <h2>Breves respuestas a las grandes preguntas</h2>
          <p class="autor">Stephen Hawking</p>
          <p>Una mirada clara y accesible a las preguntas más profundas sobre el universo y nuestro futuro.</p>
        </figcaption>
      </figure>

      <figure class="libro">
        <img
          src="https://res.cloudinary.com/uql3pxps/image/upload/v1786702186/las_mil_y_una_noches_0_uosasy.webp"
          alt="Portada de Las mil y una noches"
          loading="lazy"
          decoding="async"
        >
        <figcaption>
          <h2>Las mil y una noches</h2>
          <p class="autor">Anónimo</p>
          <p>Una colección de relatos fantásticos enlazados por la voz y el ingenio de Sherezade.</p>
        </figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
